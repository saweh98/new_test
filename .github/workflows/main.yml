name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read

    concurrency:
      group: rdp-${{ github.ref }}
      cancel-in-progress: false

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_HOSTNAME: gh-runner-${{ github.run_id }}
      RDP_USER: runner-debug
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Validate secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'TAILSCALE_AUTH_KEY is required'
          }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'RDP_PASSWORD is required'
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$env:TAILSCALE_HOSTNAME" `
            --accept-routes=false `
            --advertise-tags=tag:ci

          $tsIp = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIp) {
            throw 'Tailscale IP not assigned'
          }

          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV

      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          # Prefer NLA if possible. Only disable it if your requirement is proven.
          # Better pattern: keep NLA enabled and use a restricted access path.

          # Restrict firewall to Tailscale source; do not allow 3389 from any source.
          # Example pattern:
          # New-NetFirewallRule -DisplayName 'RDP from Tailscale' `
          #   -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
          #   -RemoteAddress '100.64.0.0/10' -Enabled True

          Restart-Service -Name TermService -Force

      - name: Create user with secure password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $securePass = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USER

      - name: Verify RDP connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hostIp = $env:TAILSCALE_IP
          $conn = Test-NetConnection -ComputerName $hostIp -Port 3389 -WarningAction SilentlyContinue
          if (-not $conn.TcpTestSucceeded) {
            throw "TCP connection to RDP port 3389 failed"
          }

          Write-Host "RDP endpoint is reachable on $hostIp"

      - name: Keep runner available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP User: $env:RDP_USER"
          Write-Host "Connection is available for a limited period"
          Start-Sleep -Seconds 600
